  greetings:
    sunday: It is Sunday. The world rests a little too.
    saturday: Saturday mornings are allowed to be slow.
    monday: A new week. It does not have to start in a hurry.
    spring: The light is getting longer.
    late_spring: The wind has gone soft.
    summer: This is the season for shade.
    deep_summer: You may skip the middle of the day.
    autumn: The air has cleared.
    late_autumn: The days are short now. It is fine to end early.
    winter: On cold days the inside grows wider.
    deep_winter: Deep winter. Sleeping through it is not laziness.
    year_end: The year is closing. What is left can stay left.
    new_year: A new year. Nothing has to begin.

  privacy:
    title: Privacy
    collect: We take one email address and nothing else. No other personal data is collected.
    own: Your rest records are yours. We neither sell them nor hand them on.
    export: You can download everything you have written, at any time.
    delete: Delete your account and the records go with it, at once.
    third_party: No advertising, no trackers, no third-party analytics.

